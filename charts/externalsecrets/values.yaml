# -- Enable or disable the chart and all resources
enabled: true

# -- Name of the ExternalSecret resource
# @default -- `.Release.Name-external-secret`
name: ""

# -- Name of the generated Kubernetes Secret
# @default -- `.Values.name`
targetName: ""

# -- Namespace to create the ExternalSecret in.
# An ExternalSecret only ever creates its Secret in its own namespace, so this is
# also where the generated Secret lands -- use it for a secret a consumer expects
# somewhere other than the release namespace.
# @default -- the release namespace
namespace: ""

# -- Labels for the GENERATED Secret, not for the ExternalSecret.
# Some consumers select secrets by label rather than by name, e.g.
# `kargo.akuity.io/cred-type: git`.
# Inherited by every entry under `secrets:`, which can override a key but
# cannot remove one -- an empty map there still inherits.
labels: {}

# -- Annotations for the GENERATED Secret, not for the ExternalSecret.
annotations: {}

# -- What happens to the Secret when the ExternalSecret is deleted (Delete or Retain)
deletionPolicy: Delete

# -- Type of the generated Kubernetes Secret
secretType: Opaque

# -- Default remoteKey for all fields unless overridden. Usually a UUID for Bitwarden items.
commonRemoteKey: ""

# -- Map of fields to generate from Bitwarden
fields:
  # -- Example field configuration. If your field is named `example`, you need to manually enabled it.
  # If the value to the key is a string, this is the same as setting `static: "value"`.
  example:
    # -- Enable this field
    # @default -- `true`, except for this example
    enabled: false
    # -- Name of the SecretStore/ClusterSecretStore.
    # `username` and `password` require `bitwarden-login`.
    # Additionally, `bitwarden-fields` is used for custom fields,
    # `bitwarden-notes` for notes, 
    # and `bitwarden-attachments` for attachments.
    # @default -- `bitwarden-login`
    storeRefName: bitwarden-login
    # -- Kind of the store reference
    storeRefKind: ClusterSecretStore
    # -- Override for remoteKey (optional)
    remoteKey: ""
    # -- Property to fetch from Bitwarden, e.g. `username`, `password`, `myfieldname`
    # @default -- name of the map key
    remoteProperty: password
    # -- Use a static string for this field. 
    # Ignores remoteKey and remoteProperty.
    # Can also be used to define a template that uses other remoteProperties.
    static: ""


# -- Possibility to define multiple secrets. Key-value pairs, the key is the default name.
secrets:
  # -- Example secret configuration. If your secret is named `exampleSecret`, you need to manually enabled it.
  # Supports all individual secret settings.
  exampleSecret: 
    enabled: false
    name: ""
    targetName: ""
    namespace: ""
    labels: {}
    annotations: {}
    fields: {}
