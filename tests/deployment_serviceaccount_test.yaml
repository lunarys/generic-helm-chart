suite: Service account token mounting

templates:
  - deployment.yaml

tests:
  - it: should keep the API token out of the pod by default
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should keep the API token out of the pod even when a service account is named
    set:
      serviceAccount:
        name: my-service-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "my-service-account"
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should mount the API token when the app opts in
    set:
      serviceAccount:
        name: my-service-account
        automountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: should keep the API token out of the pod when automountToken is nulled out
    set:
      serviceAccount:
        automountToken: null
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
